<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Factory Fire: Game</title>
    <link rel="stylesheet" href="../styles/site.css">
</head>
<body class="game-page">
    <nav class="game-nav">
        <div>
            <span>Survival Chance:</span>
            <b id="stat-risk">100%</b>
        </div>
        <div>
            <span>Stamina</span>
            <b id="stamina">100%</b>
        </div>
        <div>
            <span>Air</span>
            <b id="air">Bad</b>
        </div>
        <div>
            <span>Worker</span>
            <b id="playername">Turkish Turkey</b>
        </div>
        <div>
            <span>Floor:</span>
            <b id="floor">9</b>
        </div>
    </nav>

    <div class="game-layout">
        <main class="game-main" id="game">
        </main>

        <aside class="settings-bar">
            <h2>Settings</h2>
            <label>
                <input type="checkbox" id="show-chances" checked>
                Show survival chances
            </label>
            <label>
                <input type="checkbox" id="show-map" checked>
                Show map
            </label>

            <div class="mini-map" id="map">
                <p id="map-floor">9th floor</p>
                <p id="map-place">Starting room</p>
                <div class="map-box">
                    <span class="map-dot" id="map-dot"></span>
                    <div class="map-room map-roof">Roof</div>
                    <div class="map-room map-stairs">Stairs</div>
                    <div class="map-room map-workroom">Workroom</div>
                    <div class="map-room map-elevators">Elevators</div>
                    <div class="map-room map-windows">Windows</div>
                    <div class="map-room map-street">Street</div>
                </div>
            </div>
        </aside>
    </div>

    <script src="../scripts/game.js"></script>
</body>
</html>
